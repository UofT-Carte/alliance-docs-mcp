# fly.toml — Alliance Docs MCP
#
# Stateless, always-on single machine. No volume: the docs seed is baked into
# the image and the Whoosh index is rebuilt on boot (seconds), so deploys are
# zero-downtime and the machine is never pinned. Docs are refreshed weekly by
# the weekly-sync GitHub Action committing to main, which auto-deploys here
# (.github/workflows/deploy.yml); the entrypoint also runs ONE incremental sync
# at boot. There is no periodic sync inside the running container.
#
# Deploy: see docs/deploy-fly.md

app = "alliance-docs-mcp"
primary_region = "yyz"  # Toronto — closest to the Alliance MediaWiki source

[build]
  dockerfile = "Dockerfile"

[env]
  DOCS_DIR = "/data/docs"
  MEDIAWIKI_API_URL = "https://docs.alliancecan.ca/mediawiki/api.php"
  USER_AGENT = "AllianceDocsMCP/1.0"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: never scale to zero (keeps the background sync loop running and
  # eliminates cold starts). One machine stays up at all times.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Liveness probe — Fly restarts the machine if /health stops responding.
  # grace_period covers boot: prime-from-seed + build the search index before
  # the lifespan finishes and /health starts answering. On a fresh machine the
  # index is built from scratch on a single shared core, which can take a couple
  # of minutes, so give it real headroom rather than 30s.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"  # ~150-250 MB runtime; 512 MB gives headroom for the boot index build
