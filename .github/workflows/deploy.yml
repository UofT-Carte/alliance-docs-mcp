name: Deploy to Fly.io

# Ships main to Fly. Triggers:
#   - push to main (human pushes / merges)
#   - completion of "Weekly Docs Sync" (its commit is pushed with the default
#     GITHUB_TOKEN, which does NOT trigger `push` workflows, so we trigger off
#     the sync workflow finishing instead — this is what keeps live docs fresh)
#   - manual dispatch
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Weekly Docs Sync"]
    types: [completed]
  workflow_dispatch: {}

# Never run two deploys at once; a newer one supersedes an in-flight one.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # For the workflow_run trigger, only deploy when the sync succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        # The app's verdict is "is it actually serving?", not "did flyctl's
        # health-wait return cleanly?". flyctl can report failure even when the
        # rollout succeeded — e.g. its --wait-timeout deadline expires (default
        # 5m) and cancels the in-flight machines-API poll ("failed to get VM ...
        # net/http: request canceled"), or the control plane hiccups. So: retry
        # the deploy a few times, then fall back to the live health endpoint as
        # the source of truth before failing the build.
        #
        # The server binds immediately and builds its search index in the
        # background, so boot is fast; --wait-timeout 10m is generous headroom.
        run: |
          for attempt in 1 2 3; do
            echo "::group::flyctl deploy attempt $attempt"
            if flyctl deploy --remote-only --wait-timeout 10m; then
              echo "::endgroup::"
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            echo "flyctl deploy attempt $attempt reported failure."
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done
          # All flyctl attempts reported failure. For this single-machine app the
          # machine is updated in place, so if the new image were broken /health
          # would fail too — a passing /health means the new build is live and
          # flyctl simply couldn't observe it in time.
          echo "All flyctl attempts failed; verifying live health endpoint..."
          for i in $(seq 1 24); do
            if curl -fsS https://alliance-docs-mcp.fly.dev/health >/dev/null 2>&1; then
              echo "Live /health is passing; treating deploy as successful."
              exit 0
            fi
            echo "  health attempt $i: not ready; retrying in 5s..."
            sleep 5
          done
          echo "App did not become healthy; failing the deploy."
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
